<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>포레스트핏 주문취합건</title>
<style>
*{box-sizing:border-box;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7f3eb 0%,#edf3ef 100%);color:#1f2a24}
.wrap{max-width:1100px;margin:0 auto;padding:56px 28px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}
.logo{font-size:22px;font-weight:850;letter-spacing:.08em;color:#244734}
.badge{padding:9px 15px;border-radius:999px;background:#ffffffcc;color:#486052;font-size:13px;font-weight:750;box-shadow:0 8px 24px rgba(31,42,36,.06)}
.hero{text-align:center;margin-bottom:44px}
.hero h1{font-size:46px;line-height:1.15;letter-spacing:-.05em;color:#173d2b;font-weight:900;margin:0 0 14px}
.hero p{font-size:17px;color:#6d776f;font-weight:650;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{display:block;text-decoration:none;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:28px;padding:34px 32px;min-height:190px;box-shadow:0 18px 45px rgba(38,49,43,.08);transition:.22s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(38,49,43,.14)}
.icon{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:28px;background:#e6f5ec}
.card:nth-child(2) .icon{background:#fff0d9}
.card h2{font-size:28px;letter-spacing:-.04em;color:#173d2b;font-weight:900;margin:0 0 10px}
.card span{display:block;font-size:15px;color:#7c867f;font-weight:650;line-height:1.5}
.footer{margin-top:42px;text-align:center;color:#9aa39d;font-size:13px;font-weight:600}
@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">FORESTFIT</div>
    <div class="badge">주문취합건</div>
  </div>
  <section class="hero">
    <h1>주문취합건</h1>
    <p>발주·입고일정·품절 요청을 한 번에 정리합니다.</p>
  </section>
  <section class="grid">
    <a class="card" href="dongdaemun-order.html">
      <div class="icon">🏬</div>
      <h2>동대문</h2>
      <span>동대문 발주서 기준 샘플·품절·입고일정 정리</span>
    </a>
    <a class="card" href="#">
      <div class="icon">🤝</div>
      <h2>직거래</h2>
      <span>직거래 주문취합 기능 추가 예정</span>
    </a>
  </section>
  <div class="footer">FORESTFIT ORDER CENTER</div>
</div>
</body>
</html>
